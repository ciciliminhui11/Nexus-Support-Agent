# 句式模板（模板 → 意图）— v1 基线（pyparsing.Regex 编译，命名分组可溯源）
#
# 模板即正则字符串，作用在归一化后的文本上（无空格/符号）。跨意图模板同时
# 命中视为冲突，交模型层裁决；命中结果受负样本抑制（如「投诉咨询中心」）。
after_sale:
  - "帮我查询(?P<subject>退款|退货|订单|换货|快递)"
  - "取消订单(?P<order_id>.+)"
  - "申请(?P<type>退货|退款|换货|维修)"
  - "怎么退(?P<subject>货|款|换)"
product_consult:
  - "帮我查一下(?P<subject>功能|价格|参数)"
  - "给我介绍(?P<subject>.+)"
  - "价格是多少"
small_talk:
  - "谢谢(?P<thanks>.+)"
  - "感谢(?P<thanks>.+)"
  - "再见(?P<bye>.*)"
complaint:
  - "我要投诉(?P<subject>.+)"
  - "投诉你们(?P<subject>.+)"
